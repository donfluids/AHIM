name: Refresh service videos

# Sunday services are uploaded on the Monday after. This looks every day and
# commits only when the playlist has actually moved on.
on:
  schedule:
    - cron: '20 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-videos
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - run: python scripts/refresh_videos.py
      - name: Commit if the videos changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/videos
          git commit -m "Show the latest services from the Sunday Service playlist"
          git push
