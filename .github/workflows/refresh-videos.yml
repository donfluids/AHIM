name: Refresh service videos

# This file is a copy. The site lives on main, and so does the real copy of this
# workflow, but GitHub only fires scheduled jobs from the repository's default
# branch, which is still this one. Every step below works on main, so the
# schedule can run from here while the site stays where it is. Once the default
# branch is switched to main, delete this copy; main's is identical.
#
# Sunday services are uploaded on the Monday after. This looks twice a day and
# commits only when the playlist has actually moved on.
#
# Two slots, not one: GitHub gives scheduled jobs no guarantee and quietly drops
# them under load, so a missed morning slot is picked up in the evening. The odd
# minutes are deliberate too, since round times are the most contended.
on:
  schedule:
    - cron: '37 15 * * *'
    - cron: '43 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-videos
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # The site lives on main. Say so rather than relying on whichever ref
      # this happens to be started from.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - run: python scripts/refresh_videos.py
      - name: Commit if the videos changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/videos
          git commit -m "Show the latest services from the Sunday Service playlist"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Publish here rather than leaving it to the deploy workflow. A push made
      # with GITHUB_TOKEN starts no other workflow, and the workflow_run trigger
      # that was meant to cover that is read from the default branch, which does
      # not carry the deploy workflow. The result was a week of correct commits
      # on main that never reached the site.
      - name: Publish the updated site
        if: steps.commit.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github,scripts,README.md'
